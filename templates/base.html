<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Shadow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1><a href="/">Shadow</a></h1>
        <nav class="nav-right">
            
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('profile') }}">Профіль</a>
                <a href="{{ url_for('logout') }}">Вихід</a>
            {% else %}
                <a href="{{ url_for('login') }}">Вхід</a>
                <a href="{{ url_for('register') }}">Реєстрація</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class="messages">
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
